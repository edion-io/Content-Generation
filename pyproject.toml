[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[project]
name = "content-generation"
dynamic = ["version"]
description = "content generation."
authors = [
    { name = "xx", email = "xx@xx.com" }
]
license = { text = "MIT" }

requires-python = ">=3.8"
dependencies = [
    "openai>=1.35.10",
    "pandas>=2.2.2",
    "python-dotenv>=1.0.1",
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "transformers>=4.42.4",
    "datasets>=2.20.0",
    "torch>=2.3.1",
    "peft>=0.12.0",
    "trl>=0.9.4",
    "bitsandbytes>=0.43.1",
    "accelerate>=0.32.1",
    "llama-cpp-python>=0.2.79",
    "sentence-transformers>=3.0.1",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "pydantic>=2.8.2",
    "tqdm>=4.66.4",
    "matplotlib>=3.9.1",
    "seaborn>=0.13.2",
    "scikit-learn>=1.5.1",
    "rouge_score>=0.1.2",
    "nltk>=3.8.1",
    "textstat>=0.8.0",
    "huggingface-hub>=0.23.4",
]

[project.group.dev.dependencies]
ruff = "^0.5.1"
pytest = "^8.3.1"

[tool.hatch.build.targets.sdist]
include = ["common_utils/**"]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.coverage.report]
exclude_also = [
    'if __name__ == .__main__.:',
]

[tool.pytest.ini_options]
addopts = "--ignore=docker/"